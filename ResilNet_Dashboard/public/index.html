<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResilNet | Multi-Hazard Early Warning Command</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- TOP BAR -->
  <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
      <h1 class="text-xl font-bold tracking-wide text-white">RESILNET <span class="text-xs px-2 py-0.5 rounded bg-red-950 text-red-400 border border-red-800">ESP-NOW MESH ACTIVE</span></h1>
    </div>
    <div id="status-badge" class="px-4 py-1.5 rounded-full text-xs font-bold bg-green-950 text-green-400 border border-green-800">
      SYSTEM STATE: NORMAL
    </div>
  </header>

  <!-- MAIN GRID -->
  <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- LEFT COLUMN: MULTI-HAZARD RISK CARDS -->
    <div class="space-y-6">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400">Multi-Hazard Confidence Scores</h2>
      
      <!-- Flood Card -->
      <div class="bg-gray-900 p-5 rounded-xl border border-gray-800">
        <div class="flex justify-between items-center mb-3">
          <span class="font-bold text-blue-400">🌊 Flash Flood Risk</span>
          <span id="score-flood" class="text-lg font-extrabold text-blue-400">0%</span>
        </div>
        <div class="w-full bg-gray-800 rounded-full h-2.5">
          <div id="bar-flood" class="bg-blue-500 h-2.5 rounded-full" style="width: 0%"></div>
        </div>
      </div>

      <!-- Fire Card -->
      <div class="bg-gray-900 p-5 rounded-xl border border-gray-800">
        <div class="flex justify-between items-center mb-3">
          <span class="font-bold text-orange-400">🔥 Forest Fire Risk</span>
          <span id="score-fire" class="text-lg font-extrabold text-orange-400">0%</span>
        </div>
        <div class="w-full bg-gray-800 rounded-full h-2.5">
          <div id="bar-fire" class="bg-orange-500 h-2.5 rounded-full" style="width: 0%"></div>
        </div>
      </div>

      <!-- Quake Card -->
      <div class="bg-gray-900 p-5 rounded-xl border border-gray-800">
        <div class="flex justify-between items-center mb-3">
          <span class="font-bold text-purple-400">⚡ Seismic Activity</span>
          <span id="score-quake" class="text-lg font-extrabold text-purple-400">0%</span>
        </div>
        <div class="w-full bg-gray-800 rounded-full h-2.5">
          <div id="bar-quake" class="bg-purple-500 h-2.5 rounded-full" style="width: 0%"></div>
        </div>
      </div>

      <!-- HGI Report Button -->
      <div class="bg-gray-900 p-5 rounded-xl border border-gray-800 space-y-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">Simulate Human Ground Intelligence (HGI)</h3>
        <button onclick="sendHGI('FIRE')" class="w-full bg-red-900 hover:bg-red-800 text-white text-xs font-bold py-2 rounded">REPORT SMOKE / FIRE SIGHTED</button>
      </div>
    </div>

    <!-- CENTER COLUMN: TELEMETRY STREAM & MAP -->
    <div class="lg:col-span-2 space-y-6 flex flex-col">
      <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 h-64">
        <div id="map" class="w-full h-full rounded-lg"></div>
      </div>

      <!-- LIVE TELEMETRY CHART -->
      <div class="bg-gray-900 p-5 rounded-xl border border-gray-800 flex-1">
        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-4">Live Multi-Sensor Telemetry</h3>
        <canvas id="telemetryChart" class="max-h-48"></canvas>
      </div>
    </div>

  </main>

  <script>
    // INITIALIZE MAP
    const map = L.map('map').setView([12.9716, 77.5946], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
    const marker = L.marker([12.9716, 77.5946]).addTo(map).bindPopup("<b>ESP-NOW Mesh Node 1</b><br>Active Monitoring").openPopup();

    // INITIALIZE CHART
    const ctx = document.getElementById('telemetryChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Water Distance (cm)', borderColor: '#3b82f6', data: [], tension: 0.3 },
          { label: 'Temperature (°C)', borderColor: '#f97316', data: [], tension: 0.3 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, scales: { x: { display: false } } }
    });

    // WEBSOCKET CONNECTION
    const ws = new WebSocket('ws://localhost:8000');
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      const scores = data.ai_score.scores;
      
      // Update Scores & Bars
      document.getElementById('score-flood').innerText = scores.FLOOD + '%';
      document.getElementById('bar-flood').style.width = scores.FLOOD + '%';
      document.getElementById('score-fire').innerText = scores.FIRE + '%';
      document.getElementById('bar-fire').style.width = scores.FIRE + '%';
      document.getElementById('score-quake').innerText = scores.EARTHQUAKE + '%';
      document.getElementById('bar-quake').style.width = scores.EARTHQUAKE + '%';

      // Update System Badge
      const badge = document.getElementById('status-badge');
      badge.innerText = 'SYSTEM STATE: ' + data.ai_score.status;
      if (data.ai_score.status === 'CRITICAL_ALERT') {
        badge.className = 'px-4 py-1.5 rounded-full text-xs font-bold bg-red-950 text-red-400 border border-red-800 animate-bounce';
      }

      // Update Chart
      const now = new Date().toLocaleTimeString();
      chart.data.labels.push(now);
      chart.data.datasets[0].data.push(data.telemetry.dist);
      chart.data.datasets[1].data.push(data.telemetry.temp);
      if (chart.data.labels.length > 15) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); chart.data.datasets[1].data.shift(); }
      chart.update();
    };

    function sendHGI(type) {
      ws.send(JSON.stringify({ type: 'HGI', obs: type }));
    }
  </script>
</body>
</html>
